<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Parking System Sprint Output Status</title>
  <desc id="desc">Sprint-wise project output status for authentication, booking, parking management, payment, map, maintenance, admin roles, Stripe, email notifications, and agile artifacts.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="42%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <style>
      .font { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .title { fill: #f8fafc; font-size: 52px; font-weight: 800; letter-spacing: 0; }
      .subtitle { fill: #cbd5e1; font-size: 24px; font-weight: 500; letter-spacing: 0; }
      .sectionTitle { fill: #f8fafc; font-size: 27px; font-weight: 800; letter-spacing: 0; }
      .smallTitle { fill: #e2e8f0; font-size: 20px; font-weight: 800; letter-spacing: 0; }
      .body { fill: #cbd5e1; font-size: 20px; font-weight: 500; letter-spacing: 0; }
      .bodyStrong { fill: #f8fafc; font-size: 20px; font-weight: 750; letter-spacing: 0; }
      .tiny { fill: #94a3b8; font-size: 16px; font-weight: 600; letter-spacing: 0; }
      .pillText { fill: #07111f; font-size: 15px; font-weight: 850; letter-spacing: 0; }
      .done { fill: #86efac; }
      .partial { fill: #fde68a; }
      .planned { fill: #bfdbfe; }
      .risk { fill: #fecaca; }
      .card { fill: rgba(15, 23, 42, 0.78); stroke: rgba(148, 163, 184, 0.26); stroke-width: 1.5; }
      .line { stroke: rgba(148, 163, 184, 0.24); stroke-width: 1.4; }
      .tickDone { fill: #22c55e; }
      .tickPartial { fill: #f59e0b; }
      .tickPlanned { fill: #3b82f6; }
      .tickRisk { fill: #ef4444; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#pageBg)"/>
  <rect x="0" y="0" width="1600" height="1000" fill="#020617" opacity="0.18"/>
  <rect x="90" y="76" width="1420" height="848" rx="28" fill="rgba(2, 6, 23, 0.40)" stroke="rgba(226, 232, 240, 0.10)"/>
  <rect x="120" y="116" width="1360" height="6" rx="3" fill="url(#accent)"/>

  <text x="120" y="184" class="font title">Parking System Project Output by Sprint</text>
  <text x="120" y="226" class="font subtitle">Verification summary from local code and project agile documents</text>

  <g transform="translate(120 270)" filter="url(#shadow)">
    <rect class="card" width="430" height="430" rx="18"/>
    <rect x="24" y="24" width="120" height="34" rx="17" fill="#22c55e"/>
    <text x="49" y="47" class="font pillText">COMPLETE</text>
    <text x="24" y="94" class="font sectionTitle">Sprint 1</text>
    <text x="24" y="126" class="font tiny">Core auth, booking flow, parking, payments</text>
    <line x1="24" y1="154" x2="406" y2="154" class="line"/>

    <circle cx="34" cy="191" r="10" class="tickDone"/>
    <text x="56" y="198" class="font bodyStrong">JWT authentication</text>
    <text x="56" y="226" class="font body">Register, login, protected routes, profiles</text>

    <circle cx="34" cy="266" r="10" class="tickDone"/>
    <text x="56" y="273" class="font bodyStrong">4-step rental booking flow</text>
    <text x="56" y="301" class="font body">Dates, details, payment, confirmation ID</text>

    <circle cx="34" cy="341" r="10" class="tickDone"/>
    <text x="56" y="348" class="font bodyStrong">Parking management</text>
    <text x="56" y="376" class="font body">Spot list, filters, availability, sessions</text>

    <circle cx="34" cy="402" r="10" class="tickDone"/>
    <text x="56" y="409" class="font bodyStrong">Payment options</text>
  </g>

  <g transform="translate(585 270)" filter="url(#shadow)">
    <rect class="card" width="430" height="430" rx="18"/>
    <rect x="24" y="24" width="120" height="34" rx="17" fill="#22c55e"/>
    <text x="49" y="47" class="font pillText">COMPLETE</text>
    <text x="24" y="94" class="font sectionTitle">Sprint 2</text>
    <text x="24" y="126" class="font tiny">Management enhancements, live map, maintenance</text>
    <line x1="24" y1="154" x2="406" y2="154" class="line"/>

    <circle cx="34" cy="191" r="10" class="tickDone"/>
    <text x="56" y="198" class="font bodyStrong">Booking management</text>
    <text x="56" y="226" class="font body">My bookings, status filters, cancellation</text>

    <circle cx="34" cy="266" r="10" class="tickDone"/>
    <text x="56" y="273" class="font bodyStrong">Live parking map</text>
    <text x="56" y="301" class="font body">Leaflet map, markers, status, route search</text>

    <circle cx="34" cy="341" r="10" class="tickDone"/>
    <text x="56" y="348" class="font bodyStrong">Pre-booking workflow</text>
    <text x="56" y="376" class="font body">Reserve parking slots and generate QR</text>

    <circle cx="34" cy="402" r="10" class="tickDone"/>
    <text x="56" y="409" class="font bodyStrong">Maintenance workflows</text>
  </g>

  <g transform="translate(1050 270)" filter="url(#shadow)">
    <rect class="card" width="430" height="430" rx="18"/>
    <rect x="24" y="24" width="138" height="34" rx="17" fill="#f59e0b"/>
    <text x="47" y="47" class="font pillText">ONGOING</text>
    <text x="24" y="94" class="font sectionTitle">Sprint 3</text>
    <text x="24" y="126" class="font tiny">Stripe, admin controls, email notifications</text>
    <line x1="24" y1="154" x2="406" y2="154" class="line"/>

    <circle cx="34" cy="191" r="10" class="tickPartial"/>
    <text x="56" y="198" class="font bodyStrong">Stripe completion</text>
    <text x="56" y="226" class="font body">Backend intent exists; frontend incomplete</text>

    <circle cx="34" cy="266" r="10" class="tickPartial"/>
    <text x="56" y="273" class="font bodyStrong">Role-based admin controls</text>
    <text x="56" y="301" class="font body">Role field, admin routes and admin UI present</text>

    <circle cx="34" cy="341" r="10" class="tickPartial"/>
    <text x="56" y="348" class="font bodyStrong">Admin dashboard</text>
    <text x="56" y="376" class="font body">Users, spots and analytics tabs available</text>

    <circle cx="34" cy="402" r="10" class="tickPlanned"/>
    <text x="56" y="409" class="font bodyStrong">Email notifications planned</text>
  </g>

  <g transform="translate(120 735)" filter="url(#shadow)">
    <rect class="card" width="900" height="150" rx="18"/>
    <text x="28" y="44" class="font sectionTitle">Agile Artifacts Used</text>
    <text x="28" y="82" class="font body">Product backlog, sprint board, roadmap, and issue tracker are present in the repository.</text>
    <text x="28" y="116" class="font tiny">Files checked: BACKLOG.md, SPRINT_BOARD.md, ROADMAP.md, DOCS_INDEX.md</text>

    <g transform="translate(648 30)">
      <rect x="0" y="0" width="210" height="34" rx="17" fill="#38bdf8"/>
      <text x="33" y="23" class="font pillText">DOCUMENTED</text>
      <rect x="0" y="52" width="210" height="34" rx="17" fill="#22c55e"/>
      <text x="39" y="75" class="font pillText">CODE FOUND</text>
    </g>
  </g>

  <g transform="translate(1050 735)" filter="url(#shadow)">
    <rect class="card" width="430" height="150" rx="18"/>
    <text x="28" y="44" class="font sectionTitle">Final Verdict</text>
    <text x="28" y="82" class="font bodyStrong done">Sprint 1: Executed</text>
    <text x="28" y="110" class="font bodyStrong done">Sprint 2: Executed</text>
    <text x="28" y="138" class="font bodyStrong partial">Sprint 3: Partially executed / ongoing</text>
  </g>

  <g transform="translate(122 918)">
    <circle cx="10" cy="10" r="8" class="tickDone"/>
    <text x="27" y="16" class="font tiny">Complete</text>
    <circle cx="130" cy="10" r="8" class="tickPartial"/>
    <text x="147" y="16" class="font tiny">Partial / ongoing</text>
    <circle cx="305" cy="10" r="8" class="tickPlanned"/>
    <text x="322" y="16" class="font tiny">Planned</text>
    <text x="1290" y="16" class="font tiny">Generated for presentation use</text>
  </g>
</svg>
